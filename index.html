<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>How Earth Formed — Interactive 3D</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Instrument+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#07080d;--ink:#eee7da;--dim:#a39c8f;--ember:#ff8a3d;--sea:#4aa3ff;--card:rgba(14,14,20,.82)}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:'Instrument Sans',system-ui,sans-serif;overflow:hidden}
canvas{position:fixed;inset:0;width:100%;height:100%;touch-action:none;cursor:grab}
canvas:active{cursor:grabbing}
header{position:fixed;top:0;left:0;right:0;padding:18px 22px;pointer-events:none}
header h1{margin:0;font:600 clamp(20px,3.4vw,32px)/1.1 'Fraunces',Georgia,serif;letter-spacing:-.01em}
header p{margin:4px 0 0;color:var(--dim);font-size:13px}
#card{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);width:min(640px,calc(100% - 28px));background:var(--card);backdrop-filter:blur(10px);border:1px solid #ffffff1f;border-radius:14px;padding:18px 20px 14px}
#when{color:var(--ember);font-size:13px;font-weight:600;margin:0 0 4px}
#title{margin:0 0 8px;font:600 clamp(22px,4vw,28px)/1.15 'Fraunces',Georgia,serif}
#txt{margin:0;font-size:15px;line-height:1.55;color:#d8d1c4;min-height:7.2em}
#nav{display:flex;align-items:center;gap:10px;margin-top:12px}
#dots{display:flex;gap:6px;flex:1;justify-content:center}
#dots button{width:11px;height:11px;padding:0;border-radius:50%;border:1px solid #ffffff66;background:transparent;cursor:pointer}
#dots button.on{background:var(--ember);border-color:var(--ember)}
.btn{background:#ffffff14;color:var(--ink);border:1px solid #ffffff2b;border-radius:8px;padding:8px 14px;font:600 14px 'Instrument Sans',sans-serif;cursor:pointer}
.btn:hover{background:#ffffff26}
.btn:disabled{opacity:.35;cursor:default}
:focus-visible{outline:2px solid var(--sea);outline-offset:2px}
#hint{position:fixed;right:18px;top:20px;color:var(--dim);font-size:12px;pointer-events:none}
@media(max-width:560px){#hint{display:none}#txt{font-size:14px;min-height:8.5em}}
</style>
</head>
<body>
<canvas id="c" aria-label="3D model of Earth forming"></canvas>
<header><h1>How Earth Formed</h1><p>4.6 billion years in seven steps</p></header>
<div id="hint">Drag to rotate · scroll to zoom</div>
<section id="card" aria-live="polite">
  <p id="when"></p><h2 id="title"></h2><p id="txt"></p>
  <div id="nav">
    <button class="btn" id="prev">Back</button>
    <div id="dots"></div>
    <button class="btn" id="next">Next</button>
  </div>
</section>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const STAGES=[
{t:'A cloud of gas and dust',w:'About 4.6 billion years ago',
 x:'A huge cloud of hydrogen, helium and dust, seeded with heavy elements from older stars, begins to collapse under its own gravity — possibly nudged by a nearby supernova. As it shrinks it spins faster, and a young Sun ignites at the centre.',
 p:{tx:0,d:24,thick:1,sun:.35,pOp:.9,eS:0,lava:0,water:0,life:0,atm:0,th:0,mS:0}},
{t:'The disk flattens',w:'4.6 – 4.55 billion years ago',
 x:'Spin flattens the cloud into a rotating disk. Dust grains stick together, then clump into pebbles, then into kilometre-sized planetesimals. Rock and metal survive close to the Sun; ices only survive far out.',
 p:{tx:0,d:20,thick:.04,sun:1,pOp:.9,eS:.12,lava:0,water:0,life:0,atm:0,th:0,mS:0}},
{t:'A molten proto-Earth',w:'About 4.54 billion years ago',
 x:'Planetesimals collide and merge, growing into a planet. The energy of constant impacts and the decay of radioactive elements melt it. Dense iron sinks to form the core while lighter rock floats up to form the mantle.',
 p:{tx:7,d:3.6,thick:.04,sun:1,pOp:.2,eS:1,lava:1,water:0,life:0,atm:0,th:0,mS:0}},
{t:'The giant impact',w:'About 4.5 billion years ago',
 x:'A Mars-sized body, called Theia, strikes the young Earth at a glancing angle. The collision melts and vaporizes huge amounts of rock and flings debris into orbit.',
 p:{tx:7,d:6.5,thick:.04,sun:1,pOp:.1,eS:1,lava:1,water:0,life:0,atm:0,th:.45,mS:0}},
{t:'The Moon forms',w:'Within a few tens of millions of years',
 x:'The debris ring clumps together into the Moon. The impact also left Earth spinning fast and gave it a tilted axis, which helps create our seasons. Watch the Moon orbit.',
 p:{tx:7,d:8,thick:.04,sun:1,pOp:.08,eS:1,lava:.6,water:0,life:0,atm:0,th:0,mS:.27}},
{t:'Cooling and oceans',w:'4.4 – 4.0 billion years ago',
 x:'The surface cools and hardens into a crust. Volcanoes release gases that build an early atmosphere. Water vapour condenses and rain fills the basins, forming the first oceans. Some water may also have come from icy asteroids.',
 p:{tx:7,d:4.2,thick:.04,sun:1,pOp:.04,eS:1,lava:0,water:1,life:0,atm:.55,th:0,mS:.27}},
{t:'A living planet',w:'From about 3.8 billion years ago',
 x:'Life appears in the oceans. Over billions of years, photosynthesis fills the air with oxygen, continents drift, and the planet becomes the one we know. Earth is now about 4.5 billion years old.',
 p:{tx:7,d:4.2,thick:.04,sun:1,pOp:0,eS:1,lava:0,water:1,life:1,atm:.7,th:0,mS:.27}}
];

const cv=document.getElementById('c');
const R=new THREE.WebGLRenderer({canvas:cv,antialias:true});
R.setPixelRatio(Math.min(devicePixelRatio,2));
const scene=new THREE.Scene();
const cam=new THREE.PerspectiveCamera(50,1,.1,600);
function resize(){R.setSize(innerWidth,innerHeight,false);cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix()}
addEventListener('resize',resize);resize();

scene.add(new THREE.AmbientLight(0x303848,.55));
const sunLight=new THREE.PointLight(0xfff1d6,1.5,0);scene.add(sunLight);

/* stars */
{const n=1800,a=new Float32Array(n*3);
 for(let i=0;i<n;i++){const v=new THREE.Vector3().randomDirection?0:0;
  const u=Math.random()*2-1,t=Math.random()*6.283,s=Math.sqrt(1-u*u),r=250+Math.random()*100;
  a[i*3]=r*s*Math.cos(t);a[i*3+1]=r*u;a[i*3+2]=r*s*Math.sin(t)}
 const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(a,3));
 scene.add(new THREE.Points(g,new THREE.PointsMaterial({color:0xffffff,size:1.1,sizeAttenuation:false})))}

/* sun */
const sun=new THREE.Mesh(new THREE.SphereGeometry(1.2,32,32),new THREE.MeshBasicMaterial({color:0xffd58a}));
scene.add(sun);
const halo=new THREE.Mesh(new THREE.SphereGeometry(1.2,32,32),new THREE.MeshBasicMaterial({color:0xff9a3d,transparent:true,opacity:.25,blending:THREE.AdditiveBlending,depthWrite:false}));
halo.scale.setScalar(1.7);sun.add(halo);

/* nebula / disk particles */
const N=3500,P=[],pp=new Float32Array(N*3);
for(let i=0;i<N;i++){const r=2+Math.pow(Math.random(),.8)*10.5;
 P.push({r,ph:Math.acos(2*Math.random()-1),a:Math.random()*6.283,w:1.6/Math.pow(r,1.5)})}
const pg=new THREE.BufferGeometry();pg.setAttribute('position',new THREE.BufferAttribute(pp,3));
const pm=new THREE.PointsMaterial({color:0xffc9a0,size:.1,transparent:true,opacity:.9,depthWrite:false,blending:THREE.AdditiveBlending});
scene.add(new THREE.Points(pg,pm));

/* earth group at orbit distance 7 */
const G=new THREE.Group();G.position.set(7,0,0);scene.add(G);
const earth=new THREE.Mesh(new THREE.SphereGeometry(1,64,64),new THREE.MeshStandardMaterial({color:0x4a3d35,roughness:.9}));
G.add(earth);

function makeTex(){
 const c=document.createElement('canvas');c.width=1024;c.height=512;const x=c.getContext('2d');
 x.fillStyle='#1b5fa6';x.fillRect(0,0,1024,512);
 let s=7;const rnd=()=>(s=(s*16807)%2147483647)/2147483647;
 for(let i=0;i<46;i++){const cx=rnd()*1024,cy=90+rnd()*330,r=25+rnd()*70;
  for(let k=0;k<9;k++){x.fillStyle=k%3?'#3f8a45':'#8a7a4a';x.beginPath();
   x.ellipse(cx+(rnd()-.5)*r,cy+(rnd()-.5)*r*.6,r*(.4+rnd()*.5),r*(.25+rnd()*.35),rnd()*3,0,6.283);x.fill()}}
 x.fillStyle='#f2f6fa';x.fillRect(0,0,1024,26);x.fillRect(0,486,1024,26);
 for(let i=0;i<60;i++){x.fillStyle='rgba(255,255,255,.22)';x.beginPath();
  x.ellipse(rnd()*1024,rnd()*512,30+rnd()*60,6+rnd()*10,0,0,6.283);x.fill()}
 return new THREE.CanvasTexture(c)}
const earthTex=new THREE.Mesh(new THREE.SphereGeometry(1.003,64,64),
 new THREE.MeshStandardMaterial({map:makeTex(),transparent:true,opacity:0,roughness:.8}));
G.add(earthTex);
const atm=new THREE.Mesh(new THREE.SphereGeometry(1.07,48,48),
 new THREE.MeshBasicMaterial({color:0x5aa8ff,transparent:true,opacity:0,side:THREE.BackSide,blending:THREE.AdditiveBlending,depthWrite:false}));
G.add(atm);
const theia=new THREE.Mesh(new THREE.SphereGeometry(1,32,32),new THREE.MeshStandardMaterial({color:0xb5703f,emissive:0x5a1d00,roughness:.9}));
G.add(theia);
const moon=new THREE.Mesh(new THREE.SphereGeometry(1,32,32),new THREE.MeshStandardMaterial({color:0xb9b6b0,roughness:1}));
G.add(moon);
const flash=new THREE.PointLight(0xffa24a,0,12);G.add(flash);

/* state */
const cur=Object.assign({},STAGES[0].p);
let idx=0,yaw=.5,pitch=.38,zoom=1,drag=false,lx=0,ly=0,time=0;
const lava=new THREE.Color(0xff5a14),rock=new THREE.Color(0x4a3d35),sea=new THREE.Color(0x1d5fa8),tmp=new THREE.Color();

cv.addEventListener('pointerdown',e=>{drag=true;lx=e.clientX;ly=e.clientY;cv.setPointerCapture(e.pointerId)});
cv.addEventListener('pointerup',()=>drag=false);
cv.addEventListener('pointermove',e=>{if(!drag)return;
 yaw-=(e.clientX-lx)*.006;pitch=Math.max(-1.3,Math.min(1.3,pitch+(e.clientY-ly)*.006));lx=e.clientX;ly=e.clientY});
cv.addEventListener('wheel',e=>{e.preventDefault();zoom=Math.max(.4,Math.min(2.5,zoom*(1+e.deltaY*.001)))},{passive:false});

const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
let last=performance.now();
function frame(now){
 const dt=Math.min((now-last)/1000,.05);last=now;time+=dt;
 const T=STAGES[idx].p,k=reduce?1:1-Math.pow(.02,dt);
 for(const key in T)cur[key]+=(T[key]-cur[key])*k;

 sun.scale.setScalar(cur.sun);
 pm.opacity=cur.pOp;
 for(let i=0;i<N;i++){const p=P[i];p.a+=p.w*dt*(reduce?0:1);
  const s=Math.sin(p.ph);pp[i*3]=p.r*s*Math.cos(p.a);pp[i*3+1]=p.r*Math.cos(p.ph)*cur.thick;pp[i*3+2]=p.r*s*Math.sin(p.a)}
 pg.attributes.position.needsUpdate=true;

 earth.visible=cur.eS>.01;
 earth.scale.setScalar(Math.max(cur.eS,.001));earthTex.scale.setScalar(Math.max(cur.eS,.001));atm.scale.setScalar(Math.max(cur.eS,.001));
 tmp.copy(rock).lerp(lava,cur.lava).lerp(sea,cur.water);
 earth.material.color.copy(tmp);
 earth.material.emissive.copy(lava).multiplyScalar(cur.lava*.7);
 earthTex.material.opacity=cur.life;
 atm.material.opacity=cur.atm*.5;
 earth.rotation.y=earthTex.rotation.y=time*.15;

 /* Theia impact loop */
 const th=cur.th;theia.visible=th>.02;theia.scale.setScalar(Math.max(th,.001));
 let fl=0;
 if(th>.02){const tt=(time%5)/5,e=Math.min(tt/.8,1),q=e*e;
  theia.position.set(5-q*4.3,1.8-q*1.4,1.5-q*1.1);
  if(tt>.8){theia.visible=false;fl=Math.max(0,1-(tt-.8)*4)*6}}
 flash.intensity=fl;

 moon.visible=cur.mS>.02;moon.scale.setScalar(Math.max(cur.mS,.001));
 const ma=time*.5;moon.position.set(Math.cos(ma)*3.2,.35*Math.sin(ma),Math.sin(ma)*3.2);

 const dist=cur.d*zoom,tx=cur.tx;
 cam.position.set(tx+dist*Math.cos(pitch)*Math.sin(yaw),dist*Math.sin(pitch),dist*Math.cos(pitch)*Math.cos(yaw));
 cam.lookAt(tx,0,0);
 if(!drag&&!reduce)yaw+=dt*.04;
 R.render(scene,cam);requestAnimationFrame(frame)}
requestAnimationFrame(frame);

/* UI */
const $=id=>document.getElementById(id);
const dots=$('dots');
STAGES.forEach((s,i)=>{const b=document.createElement('button');b.setAttribute('aria-label','Step '+(i+1)+': '+s.t);b.onclick=()=>go(i);dots.appendChild(b)});
function go(i){idx=Math.max(0,Math.min(STAGES.length-1,i));const s=STAGES[idx];
 $('when').textContent=s.w;$('title').textContent=s.t;$('txt').textContent=s.x;
 [...dots.children].forEach((d,j)=>d.classList.toggle('on',j===idx));
 $('prev').disabled=idx===0;$('next').textContent=idx===STAGES.length-1?'Restart':'Next'}
$('prev').onclick=()=>go(idx-1);
$('next').onclick=()=>go(idx===STAGES.length-1?0:idx+1);
addEventListener('keydown',e=>{if(e.key==='ArrowRight')$('next').click();if(e.key==='ArrowLeft')$('prev').click()});
go(0);
</script>
</body>
</html>
